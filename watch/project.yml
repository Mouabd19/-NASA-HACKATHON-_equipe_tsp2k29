# Source du projet Xcode. Régénérer après modif : xcodegen generate
# (les fichiers ajoutés dans iOS/, Watch/ ou Shared/ sont pris automatiquement)
name: SOLZeroWatch
options:
  bundleIdPrefix: com.tsp2k29.solzero
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: WGKG396HUD
    # Préfixe des identifiants : à changer ici seulement si Xcode dit qu'il est déjà pris
    BUNDLE_PREFIX: com.tsp2k29.solzero
targets:
  SOLZeroWatch:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).SOLZeroWatch
        PRODUCT_NAME: SOLZeroWatch
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/SOLZeroWatch.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SOLZeroWatch Watch App
  SOLZeroWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).SOLZeroWatch.watchkitapp
        PRODUCT_NAME: SOLZeroWatch Watch App
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/SOLZeroWatch Watch App.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
