# Publie le deck de pitch (public/slides) sur GitHub Pages, indépendamment du déploiement Vercel de l'app.
name: Pitch deck on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/slides/**', 'docs/pitch/TriFlow-demo-slides.pdf', '.github/workflows/slides-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r public/slides/. _site/
          cp docs/pitch/TriFlow-demo-slides.pdf _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
